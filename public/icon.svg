<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
  </defs>

  <!-- Background Circle with Gold Ring -->
  <circle cx="50" cy="50" r="47" fill="url(#bg)" stroke="url(#gold)" stroke-width="3.5" />

  <!-- Yin-Yang Golden Half -->
  <path d="M 50 5 A 45 45 0 0 1 50 95 A 22.5 22.5 0 0 1 50 50 A 22.5 22.5 0 0 0 50 5 Z" fill="url(#gold)" />

  <!-- Small inner dots -->
  <circle cx="50" cy="27.5" r="5.5" fill="#020617" />
  <circle cx="50" cy="72.5" r="5.5" fill="url(#gold)" />
</svg>
